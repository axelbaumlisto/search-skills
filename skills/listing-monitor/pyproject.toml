[project]
name = "listing-monitor"
version = "0.1.0"
description = "Мониторинг объявлений аренды (Chợ Tốt, Facebook Marketplace, Telegram, muaban) с отправкой свежих в Telegram"
requires-python = ">=3.11"
dependencies = ["telethon>=1.36"]

[project.scripts]
listing-monitor = "listing_monitor.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listing_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
