# Example search: 2-bedroom house in Phu Quoc up to 20M VND/month.
# Copy outside the repo, fill in sessions/host/recipient, run with --config <file>.
name = "Фукуок"
env_file = "~/.config/search-skills/.env"   # TG_API_ID / TG_API_HASH
max_price_vnd = 20_000_000
min_price_vnd = 3_500_000    # дешевле за дом с 2 спальнями не бывает — это цена за ночь
offer = "rent"
min_bedrooms = 2
exclude_keywords = ["байк", "скутер", "мотоцикл", "xe máy", "nha trang", "нячанг", "đà nẵng", "da nang", "дананг", "hội an", "хойан", "hồ chí minh", "sài gòn", "hcm", "hà nội", "vũng tàu", "đà lạt"]
city_keywords = ["фукуок", "phú quốc", "phu quoc", "phuquoc", "dương đông", "duong dong", "дуонг донг",
                 "ông lang", "ong lang", "онг ланг", "an thới", "антхой", "meyhomes", "suối đá", "cửa lấp"]

[center]
label = "KingKong Mart"
lat = 10.19538
lng = 103.96795

[districts]   # подстрока в тексте = [lat, lng] центра района (приблизительно)
"ночного рынка" = [10.2166, 103.9587]
"chợ đêm" = [10.2166, 103.9587]
"dinh cậu" = [10.2177, 103.9565]
"30/4" = [10.217, 103.963]
"dương đông" = [10.2156, 103.9609]
"duong dong" = [10.2156, 103.9609]
"дуонг донг" = [10.2156, 103.9609]
"cây thông" = [10.231, 104.001]
"suối đá" = [10.24, 103.978]
"ông lang" = [10.267, 103.947]
"ong lang" = [10.267, 103.947]
"онг ланг" = [10.267, 103.947]
"cửa lấp" = [10.165, 103.98]
"dương tơ" = [10.156, 103.989]
"suối mây" = [10.176, 103.996]
"búng gội" = [10.28, 103.956]
"đường bào" = [10.206, 104.01]
"cửa cạn" = [10.315, 103.942]
"meyhomes" = [10.111, 103.979]
"мейхоумс" = [10.111, 103.979]
"grand world" = [10.335, 103.856]
"an thới" = [10.02, 104.012]
"an thoi" = [10.02, 104.012]
"антхой" = [10.02, 104.012]
"hàm ninh" = [10.183, 104.05]
"gành dầu" = [10.37, 103.859]
"sân bay" = [10.17, 103.993]

[chotot]
area_v2 = 503112          # Thành phố Phú Quốc
categories = [1000]       # вся недвижимость; аренда отбирается по type=u

[facebook]
queries = ["cho thuê nhà", "nhà nguyên căn", "house for rent", "аренда дом"]
lat = 10.1954
lng = 103.968
radius_km = 25
limit = 30
max_details = 5
remote_host = "browser-host"      # ssh host with logged-in Chrome on CDP :9222
remote_script = "~/search-skills/skills/fb-marketplace/scripts/fb_marketplace.py"   # path on that host

[telegram]
session = "~/.config/search-skills/tg/research"      # authorized Telethon session used for search
queries = ["Фукуок аренда", "Фукуок сдам", "Фукуок дом", "фукуок спальни", "Phu Quoc rent", "cho thuê nhà Phú Quốc"]

[muaban]
urls = ["https://muaban.net/bat-dong-san/cho-thue-nha-dat-kien-giang",
        "https://muaban.net/bat-dong-san/cho-thue-nha-dat-an-giang"]
remote_host = "browser-host"      # ssh host with logged-in Chrome on CDP :9222

[notify]
session = "~/.config/search-skills/tg/default"       # account that sends the notifications
peer_id = "username_or_numeric_id"   # recipient

[paths]
state = "state.json"
master = "rentals.md"
